<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Project: Landing Page</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <nav
      class="bg-purple-800 px-10 py-4 text-white flex justify-between items-center"
    >
      <h1 class="font-bold text-3xl">S<span class="text-pink-400">H</span>T</h1>
      <ul class="font-medium flex space-x-10 justify-end">
        <li class="cursor-pointer">Home</li>
        <li class="cursor-pointer">About</li>
        <li class="cursor-pointer">Catalogue</li>
        <li class="cursor-pointer">Contact</li>
      </ul>
    </nav>
    <main class="bg-fuchsia-200 px-10 flex gap-5 justify-between">
      <div class="main min-h-96 py-24">
        <div class="text-6xl">
          The Best phones <br />
          in the town
        </div>
        <p class="py-3 w-1/3">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolores,
          facere? Qui voluptate consequatur deserunt sequi, provident molestias
          quidem illo maxime, reiciendis adipisci deleniti.
        </p>
        <div class="buttons">
          <button
            class="bg-purple-800 px-4 py-2 rounded-[10px] text-white hover:text-purple-800 hover:bg-white hover:border hover:border-purple-800"
          >
            Click me
          </button>
          <button
            class="bg-purple-800 px-4 py-2 rounded-[10px] text-white hover:text-purple-800 hover:bg-white hover:border hover:border-purple-800"
          >
            Buy Now
          </button>
        </div>
      </div>

      <div class="flex justify-center items-center">
        <img src="hello.png" alt="" class="w-full" />
      </div>
    </main>
  </body>
</html>
