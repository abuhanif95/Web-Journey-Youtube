<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="/" aria-current="page">Home</a>
        <a target="_blank" href="https://www.youtube.com/@sfthanif24">Youtube channel</a>
    </nav>

    <div id="wrapper">
        <h1>Number Guessing Game</h1>
        
        <div class="game-container">
            <p class="description">Try and guess a random number between 1 and 100.</p>
            <p class="attempts">You have <span>10</span> attempts to guess the right number.</p>

            <form class="form">
                <label for="guessField" id="guess">Guess a number</label>
                <input type="text" id="guessField" class="guessField" placeholder="Enter your guess">
                <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
            </form>

            <div class="resultParas">
                <p>Previous Guesses: <span class="guesses"></span></p>
                <p>Guesses Remaining: <span class="lastResult">10</span></p>
            </div>

            <div class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
