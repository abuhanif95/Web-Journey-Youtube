<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <div class="calculator-card">
        <h1>BMI Calculator</h1>

        <form id="bmi-form">
          <div class="input-group">
            <label for="height">Height in CM:</label>
            <input type="text" id="height" placeholder="Your Height??" />
          </div>

          <div class="input-group">
            <label for="weight">Weight in KG:</label>
            <input type="text" id="weight" placeholder="Your Weight??" />
          </div>

          <button type="submit" class="calculate-btn">Calculate BMI</button>

          <div id="results" class="results">
            <!-- Results will be displayed here -->
          </div>
        </form>

        <div id="weight-guide" class="weight-guide">
          <h3>BMI Weight Guide</h3>
          <div class="guide-box underweight">
            <p><span class="indicator"></span> Under Weight = Less than 18.6</p>
          </div>
          <div class="guide-box normal">
            <p><span class="indicator"></span> Normal Range = 18.6 - 24.9</p>
          </div>
          <div class="guide-box overweight">
            <p>
              <span class="indicator"></span> Overweight = Greater than 24.9
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
